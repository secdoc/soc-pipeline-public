<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrCyan" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrViolet" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#020617"/>
  <rect width="980" height="620" fill="url(#grid)"/>

  <text x="490" y="34" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Vulnerability findings into the SIEM central pane</text>
  <text x="490" y="54" fill="#94a3b8" font-size="11" text-anchor="middle">Greenbone (GMP) &#8594; Collector &#8594; Graylog &#8594; Wazuh central pane, with optional AI enrichment. Read-only, one pull, two consumers.</text>

  <!-- SOURCE: Greenbone -->
  <rect x="40" y="90" width="210" height="86" rx="10" fill="#0f172a" stroke="#fb923c" stroke-width="1.5"/>
  <text x="145" y="116" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Greenbone / OpenVAS</text>
  <text x="145" y="134" fill="#fed7aa" font-size="9.5" text-anchor="middle">gvmd &#183; GMP over local socket</text>
  <text x="145" y="149" fill="#fed7aa" font-size="9.5" text-anchor="middle">(Docker; not on network)</text>
  <text x="145" y="166" fill="#94a3b8" font-size="8.5" text-anchor="middle">SOURCE</text>

  <!-- one pull -->
  <line x1="250" y1="133" x2="330" y2="133" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="123" fill="#cbd5e1" font-size="8" text-anchor="middle">one read-only pull</text>
  <text x="290" y="147" fill="#64748b" font-size="7.5" text-anchor="middle">gvm-tools exec</text>

  <!-- COLLECTOR -->
  <rect x="330" y="90" width="200" height="86" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="430" y="114" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Collector</text>
  <text x="430" y="131" fill="#a5f3fc" font-size="9" text-anchor="middle">pull report (QoD-filtered)</text>
  <text x="430" y="144" fill="#a5f3fc" font-size="9" text-anchor="middle">normalize &#183; strip secrets</text>
  <text x="430" y="157" fill="#a5f3fc" font-size="9" text-anchor="middle">treat output as hostile</text>
  <text x="430" y="170" fill="#94a3b8" font-size="8.5" text-anchor="middle">COLLECT / NORMALIZE</text>

  <!-- split: two consumers -->
  <!-- forwarding path down-left -->
  <line x1="430" y1="176" x2="430" y2="215" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrCyan)"/>
  <text x="500" y="200" fill="#22d3ee" font-size="8.5" text-anchor="middle">forwarding path (GELF)</text>

  <!-- enrichment path right -->
  <line x1="530" y1="133" x2="720" y2="133" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrViolet)"/>
  <text x="625" y="123" fill="#a78bfa" font-size="8.5" text-anchor="middle">enrichment path (optional)</text>

  <!-- AI agent -->
  <rect x="720" y="96" width="220" height="74" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="830" y="120" fill="#e6edf3" font-size="12.5" font-weight="600" text-anchor="middle">AI Vuln Report Agent</text>
  <text x="830" y="137" fill="#c4b5fd" font-size="9" text-anchor="middle">LLM: findings + asset context</text>
  <text x="830" y="151" fill="#c4b5fd" font-size="9" text-anchor="middle">&#8594; ranked remediation brief</text>
  <text x="830" y="164" fill="#94a3b8" font-size="8" text-anchor="middle">ENRICH (read-only, human-in-loop)</text>

  <!-- GRAYLOG -->
  <rect x="330" y="215" width="200" height="86" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="430" y="239" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Graylog</text>
  <text x="430" y="256" fill="#a7f3d0" font-size="9" text-anchor="middle">`vuln` stream + index set</text>
  <text x="430" y="269" fill="#a7f3d0" font-size="9" text-anchor="middle">retention: full finding history</text>
  <text x="430" y="282" fill="#a7f3d0" font-size="9" text-anchor="middle">pipeline: event_type=vulnerability</text>
  <text x="430" y="295" fill="#94a3b8" font-size="8.5" text-anchor="middle">TRANSPORT / RETAIN</text>

  <!-- graylog -> wazuh -->
  <line x1="430" y1="301" x2="430" y2="340" stroke="#34d399" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="500" y="325" fill="#86efac" font-size="8.5" text-anchor="middle">forward `vuln` stream</text>

  <!-- WAZUH central pane -->
  <rect x="300" y="340" width="380" height="120" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <text x="490" y="366" fill="#e6edf3" font-size="14" font-weight="700" text-anchor="middle">Wazuh &#8212; Central Pane</text>
  <text x="490" y="387" fill="#a5f3fc" font-size="9.5" text-anchor="middle">decoder + rules (severity-gated):</text>
  <text x="490" y="404" fill="#fda4b4" font-size="9.5" text-anchor="middle">&#9679; Critical / High / KEV &#8594; ALERT (level &#8805; 10)</text>
  <text x="490" y="420" fill="#cbd5e1" font-size="9.5" text-anchor="middle">&#9679; everything else &#8594; event-only (queryable enrichment)</text>
  <text x="490" y="440" fill="#fde68a" font-size="9" text-anchor="middle">cross-correlation: SIEM alert on a host &#215; known vuln on that host = higher priority</text>
  <text x="490" y="453" fill="#94a3b8" font-size="8.5" text-anchor="middle">CORRELATE / ALERT / TRIAGE &#8594; INCIDENT</text>

  <!-- AI agent feeds the pane (brief) -->
  <path d="M 830 170 Q 830 300 682 400" fill="none" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrViolet)"/>
  <text x="800" y="300" fill="#a78bfa" font-size="8" text-anchor="middle">brief informs</text>
  <text x="800" y="311" fill="#a78bfa" font-size="8" text-anchor="middle">triage</text>

  <!-- scope divide callout -->
  <rect x="40" y="360" width="230" height="86" rx="10" fill="#0f172a" stroke="#243044" stroke-width="1"/>
  <text x="155" y="382" fill="#e6edf3" font-size="10.5" font-weight="600" text-anchor="middle">Vuln-scope divide (no double-count)</text>
  <text x="155" y="401" fill="#a5f3fc" font-size="8.5" text-anchor="middle">Wazuh native VD &#8594; agent'd hosts</text>
  <text x="155" y="416" fill="#fed7aa" font-size="8.5" text-anchor="middle">Greenbone &#8594; the un-agentable:</text>
  <text x="155" y="429" fill="#fed7aa" font-size="8.5" text-anchor="middle">firewalls, network gear, IoT,</text>
  <text x="155" y="442" fill="#fed7aa" font-size="8.5" text-anchor="middle">printers, appliances</text>

  <!-- legend -->
  <rect x="40" y="500" width="900" height="86" rx="10" fill="#0f172a" stroke="#243044" stroke-width="1"/>
  <text x="56" y="522" fill="#e6edf3" font-size="10.5" font-weight="600">Pipeline stages (the transferable part)</text>
  <text x="56" y="542" fill="#cbd5e1" font-size="9">SOURCE &#8594; COLLECT/NORMALIZE &#8594; TRANSPORT/RETAIN &#8594; CORRELATE/ALERT &#8594; TRIAGE &#8594; INCIDENT</text>
  <line x1="56" y1="556" x2="86" y2="556" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrCyan)"/>
  <text x="92" y="559" fill="#cbd5e1" font-size="8.5">forwarding path (into the pane)</text>
  <line x1="300" y1="556" x2="330" y2="556" stroke="#a78bfa" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrViolet)"/>
  <text x="336" y="559" fill="#cbd5e1" font-size="8.5">enrichment path (optional AI brief)</text>
  <text x="56" y="576" fill="#64748b" font-size="8">One read-only GMP pull feeds both paths. Alert discipline keeps the pane signal-only. Central pane stays the SIEM you already run (KISS).</text>
</svg>
