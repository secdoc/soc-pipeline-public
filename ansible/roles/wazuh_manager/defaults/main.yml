  - {src: wazuh/rules/unifi_protect_rules.xml, dest: /var/ossec/etc/rules/unifi_protect_rules.xml}
  - {src: wazuh/rules/vaultwarden_rules.xml, dest: /var/ossec/etc/rules/vaultwarden_rules.xml}
  - {src: wazuh/waf_rules.xml, dest: /var/ossec/etc/rules/waf_rules.xml}
