  - {src: wazuh/rules/greenbone_rules.xml, dest: /var/ossec/etc/rules/greenbone_rules.xml}
  - {src: wazuh/rules/hashicorp_vault_rules.xml, dest: /var/ossec/etc/rules/hashicorp_vault_rules.xml}
