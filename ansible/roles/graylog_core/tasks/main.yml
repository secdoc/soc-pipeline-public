---
- name: Require explicit apply and restart approval
  ansible.builtin.assert:
    that:
      - soc_iac_apply_confirmed | bool
      - soc_iac_restart_confirmed | bool

- name: Validate protected Graylog inputs
  ansible.builtin.assert:
    that:
      - graylog_core_password_secret is defined
      - graylog_core_password_secret | string | length >= 16
      - graylog_core_root_password_sha2 is defined
      - graylog_core_root_password_sha2 is match('^[0-9a-f]{64}$')
      - graylog_core_mongodb_uri is defined
      - graylog_core_mongodb_uri is match('^mongodb://')
      - graylog_core_validation_command | length > 0
  no_log: true

- name: Install the adopter-selected Graylog server package
  ansible.builtin.apt:
    name: "{{ graylog_core_package_name }}={{ graylog_core_package_version }}"
    state: present
    update_cache: "{{ graylog_core_update_cache | bool }}"
    policy_rc_d: 101
  when: graylog_core_install_package | bool

- name: Create protected Graylog candidate directory
  ansible.builtin.file:
    path: "{{ soc_iac_candidate_root }}/graylog-core"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render Graylog server candidate
  ansible.builtin.template:
    src: server.conf.j2
    dest: "{{ soc_iac_candidate_root }}/graylog-core/server.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Validate and activate the Graylog candidate
  when: not ansible_check_mode
  block:
    - name: Validate the candidate Graylog configuration
      ansible.builtin.command:
        argv: "{{ graylog_core_validation_command + [soc_iac_candidate_root + '/graylog-core/server.conf'] }}"
      changed_when: false
      no_log: true
    - name: Install the validated Graylog configuration
      ansible.builtin.copy:
        src: "{{ soc_iac_candidate_root }}/graylog-core/server.conf"
        dest: "{{ graylog_core_config_path }}"
        remote_src: true
        owner: root
        group: graylog
        mode: "0640"
        backup: true
      register: graylog_core_active_copy
      no_log: true
      notify: Restart Graylog server
  rescue:
    - name: Restore prior Graylog configuration
      ansible.builtin.copy:
        src: "{{ graylog_core_active_copy.backup_file }}"
        dest: "{{ graylog_core_config_path }}"
        remote_src: true
        owner: root
        group: graylog
        mode: "0640"
      when:
        - graylog_core_active_copy is defined
        - graylog_core_active_copy.backup_file is defined
      no_log: true
    - name: Remove newly created Graylog configuration
      ansible.builtin.file:
        path: "{{ graylog_core_config_path }}"
        state: absent
      when:
        - graylog_core_active_copy is defined
        - graylog_core_active_copy.changed | default(false)
        - graylog_core_active_copy.backup_file is not defined
    - name: Stop after Graylog candidate rollback
      ansible.builtin.fail:
        msg: Graylog candidate validation or activation failed; prior configuration was restored when available.
