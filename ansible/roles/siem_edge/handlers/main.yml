---
- name: Restart HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: restarted
  when: soc_iac_restart_confirmed | bool
  listen: Restart HAProxy
- name: Restart Keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: restarted
  when: soc_iac_restart_confirmed | bool
  listen: Restart Keepalived
